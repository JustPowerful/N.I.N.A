[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nina-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.54.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]